spring:
  application:
    name: agenda360
  datasource:
    url: jdbc:mysql://localhost:3306/agenda360?createDatabaseIfNotExist=true
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
